name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ShiftPlanner.sln

      - name: Format check
        run: dotnet format ShiftPlanner.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ShiftPlanner.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ShiftPlanner.sln --no-build --configuration Release --logger "console;verbosity=normal"
