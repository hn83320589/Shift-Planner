name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # 主管使用 Windows，因此除了 Ubuntu 也在 Windows 上建置與測試
    # （OR-Tools 原生程式庫、Asia/Taipei 時區解析在兩個平台的行為都要驗證）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ShiftPlanner.sln

      # Windows 的 checkout 預設轉成 CRLF，格式檢查只在 Ubuntu 執行一次
      - name: Format check
        if: runner.os == 'Linux'
        run: dotnet format ShiftPlanner.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ShiftPlanner.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ShiftPlanner.sln --no-build --configuration Release --logger "console;verbosity=normal"
